
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Uma carta para você</title>

    <!-- Fonte manuscrita -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600&display=swap"
          rel="stylesheet">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Georgia, serif;
        }


        /* =========================
           PRIMEIRA TELA
        ========================= */

        #inicio {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background-color: #eee4d5;
        }

        .botao-abrir {
            padding: 17px 38px;

            background-color: #c9ad91;
            color: #fffaf4;

            border: none;
            border-radius: 35px;

            font-family: Georgia, serif;
            font-size: 19px;
            letter-spacing: 0.3px;

            cursor: pointer;

            box-shadow: 0 4px 12px rgba(100, 75, 50, 0.12);

            transition: all 0.3s ease;
        }

        .botao-abrir:hover {
            background-color: #b99a7d;
            transform: translateY(-3px);

            box-shadow: 0 7px 16px rgba(100, 75, 50, 0.16);
        }


        /* =========================
           SEGUNDA TELA - PAPEL
        ========================= */

        #carta {
            display: none;

            min-height: 100vh;
            width: 100%;

            padding: 0;

            background-color: #f8f3e6;

            background-image:
                repeating-linear-gradient(
                    to bottom,
                    transparent 0px,
                    transparent 39px,
                    #c5d1d4 40px
                );

            background-position: 0 15px;
        }


        /* =========================
           ÁREA DE ESCRITA
        ========================= */

        .area-escrita {
            min-height: 100vh;

            padding-top: 65px;
            padding-bottom: 60px;

            padding-left: clamp(55px, 12vw, 120px);
            padding-right: clamp(20px, 8vw, 80px);

            position: relative;
        }

        .area-escrita::before {
            content: "";

            position: absolute;

            top: 0;
            bottom: 0;

            left: 38px;

            width: 1px;

            background-color: #dbaaaa;
            opacity: 0.8;
        }


        /* =========================
           FADE-IN
        ========================= */

        .conteudo-carta {
            opacity: 0;

            animation: aparecer 1.8s ease forwards;
        }

        @keyframes aparecer {

            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }


        /* =========================
           TÍTULO
        ========================= */

        .titulo-carta {

            font-family: 'Caveat', cursive;

            font-size: clamp(30px, 5vw, 39px);

            font-weight: 600;

            line-height: 40px;

            color: #39372f;

            margin-bottom: 40px;

        }


        /* =========================
           TEXTO MANUSCRITO
        ========================= */

        .texto-carta {

            font-family: 'Caveat', cursive;

            font-size: clamp(25px, 5vw, 34px);

            font-weight: 500;

            line-height: 40px;

            color: #39372f;

            white-space: pre-wrap;

            overflow-wrap: break-word;
        }


        /* =========================
           ASSINATURA
        ========================= */

        .assinatura {

            display: none;

            margin-top: 20px;

            font-family: 'Caveat', cursive;

            font-size: clamp(30px, 5vw, 38px);

            font-weight: 600;

            color: #39372f;

            animation: aparecer 1.8s ease forwards;

        }


        /* =========================
           AJUSTES PARA CELULAR
        ========================= */

        @media (max-width: 600px) {

            #inicio {
                padding: 20px;
            }

            .botao-abrir {
                font-size: 18px;
                padding: 16px 34px;
            }

            .area-escrita {
                padding-top: 55px;
                padding-bottom: 45px;

                padding-left: 58px;
                padding-right: 22px;
            }

            .area-escrita::before {
                left: 38px;
            }

            .titulo-carta {
                font-size: 32px;
                line-height: 40px;
                margin-bottom: 35px;
            }

            .texto-carta {
                font-size: 27px;
                line-height: 40px;
            }

            .assinatura {
                font-size: 34px;
            }

        }

    </style>

</head>


<body>


    <!-- PRIMEIRA TELA -->

    <section id="inicio">

        <button class="botao-abrir"
                onclick="abrirCarta()">

            Abrir a carta

        </button>

    </section>



    <!-- SEGUNDA TELA -->

    <section id="carta">

        <div class="area-escrita">

            <div class="conteudo-carta">

                <p class="titulo-carta">
                    Para: Lara, minha princesa
                </p>

                <p class="texto-carta">
                    <span id="texto"></span>
                </p>

                <p class="assinatura" id="assinatura">
                    Louise 🩵
                </p>

            </div>

        </div>

    </section>



    <!-- JAVASCRIPT -->

    <script>

        // Mensagem real da carta

        const mensagem = `Oioi, meu amor! Tudo bem? Então, eu sei que nunca te mandei nada assim antes e que, logo neste fim de semana, já te dei umas três cartas para ler (me desculpe, ksks...), mas esta aqui é uma carta um pouco mais íntima, uma carta que eu não tive coragem de te entregar. Fiz você esperar, esperar até demais, e essa foi a forma que encontrei de te dizer tudo isso: com um site, da forma mais nerd possível, ksksks.

Enfim, eu queria falar com você sobre as coisas que percebi e que te tornam diferente das minhas outras amizades. Lara, você é, sem sombra de dúvidas, uma das pessoas em quem mais confio, seja para conversar quando estou mal, seja para quando quero falar sobre algo feliz, seja para quando você só quer me perturbar. Seja lá o motivo, eu sempre vou querer falar com você.

Você é uma das poucas pessoas que já me viu fragilizada. Eu não me orgulho disso, até porque detesto me sentir assim, mas você me acolheu e me deu um porto seguro para poder descansar quando me sentisse insegura. E, mesmo que eu não fale tanto assim sobre minhas inseguranças, até porque sou covarde demais, quero que você saiba que já me ajudou o suficiente só com a sua presença.

No começo deste ano, eu estava zoando com minha amiga Duda, já falei dela para você, sobre o fato de as pessoas se apaixonarem muito facilmente. Eu concordei, óbvio, até ela soltar a frase:

"Pra mim, se você quer dizer que gosta de alguém, tem que se conhecer por, no mínimo, três anos."

Três anos.

Aquilo estalou algo na minha cabeça. Pode parecer idiota (e com certeza é), mas foi aí que percebi que eu te via em tudo.

Eu te via em gatinhos, gatinhos da internet, da rua, domésticos...

Eu te via em chá, chá Matte, chá natural, chá gelado...

Eu te via na noite, na lua, nas estrelas, nas nuvens pintadas de azul pelo céu infinito.

Eu te via em todo canto, só que sempre fui idiota demais para perceber. Precisei que a Duda me lembrasse de quanto tempo passei com você para notar.

Fui tongona demais para retribuir seus sentimentos e, para ser sincera, acho que, mesmo com a obviedade deles, eu tinha medo. Fui covarde e ignorei, como costumo fazer quando não tenho certeza, mas, quando a gente parou de se falar por um tempo, no meio do ano passado, fiquei com tanto medo, tanto, tanto, tanto medo.

Eu não queria te perder, eu não queria perder o que você significa para mim.

No fim das contas, um app fofo de pet compartilhado me ajudou a me reconciliar com você (acho que estou devendo tudo a esse app), e eu me senti muito feliz, feliz de ver que, mesmo depois das burradas catastróficas que fiz, você não estava brava comigo. Chateada, talvez, até porque fui muito tonga, mas não brava.

A gente começou a brincar de construir esse nosso futuro, em que a gente já tem os preparativos da casa, a decoração, o nome do Wi-Fi, dos possíveis filhos e dos três gatos, e eu me vi realmente querendo aquilo. Eu me vi esperando esse futuro.

Eu, como a pessoa paranoica que sou, não gosto de pensar no futuro. Odeio mudanças, sejam elas grandes ou pequenas, gosto da comodidade, e o medo do futuro me tira isso. Mas, ainda assim, eu queria pensar em morar com você, viajar para outros lugares e tirar muitas fotos, comer um monte de doce, ver vários filmes aleatórios só porque sim.

Eu sei que estou me estendendo muito, mas é porque não acho que mereço você. Você esperou algo de mim por tanto tempo, você me esperou por tanto tempo que, honestamente, não sei o que viu em mim para ter tanta paciência.

Mas sou a pessoa mais feliz de todas por ter recebido sua paciência.

Eu estou com medo de tudo: do futuro, do passado, das pessoas, da minha vida, dos pensamentos dos outros e de como tudo pode se desenrolar daqui para frente. Mas, acima de tudo, tenho medo de perder você por não ter dito nada antes que fosse tarde, por ter medo e ignorar.

Eu gostaria muito que você estivesse no meu futuro, que eu pudesse te fazer bem o máximo que puder. Gostaria de poder ter você ali quando eu perder, mas principalmente quando eu vencer, porque estar feliz é melhor quando estou com você.

E, bem, eu gostaria de transformar hoje, dia 23/11, nosso "aniversário de casamento", uma data de brincadeira, em algo real: na data em que eu largaria minha covardia, nem que por um segundo, e te chamaria de minha namorada.

Lara, meu amor, você me concederia essa honra?

Obs.: Obviamente, apesar de esperar que a resposta seja positiva, não estou te obrigando a nada. A resposta é sua, independentemente do que me agrade. Quero que você seja sincera.

Obs. 2: Eu me sinto uma songamonga igual ao Lucas mandando esse "pedido virtual" em vez de falar na cara, mas espero que você goste, porque deu um trabalhinho para montar esse site do zero.

Com muito amor, da sua criaturinha favorita,`;


        // Abrir a carta

        function abrirCarta() {

            document.getElementById("inicio").style.display = "none";

            document.getElementById("carta").style.display = "block";

            escreverTexto();

        }


        // Animação de escrita + fade-in

        function escreverTexto() {

            const elemento = document.getElementById("texto");

            const assinatura = document.getElementById("assinatura");

            let contador = 0;

            // Velocidade em milissegundos por caractere
            const velocidade = 20;

            function escrever() {

                if (contador < mensagem.length) {

                    elemento.textContent += mensagem.charAt(contador);

                    contador++;

                    setTimeout(escrever, velocidade);

                } else {

                    // Mostra a assinatura ao terminar a carta
                    assinatura.style.display = "block";

                }

            }

            escrever();

        }

    </script>


</body>
</html>
